<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agendar Reunião — Alini Farias</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#f0f2f7;min-height:100vh}
.hdr{background:#22367b;padding:0 32px;display:flex;align-items:center;justify-content:space-between;min-height:72px}
.hdr img{height:40px;object-fit:contain}
.hdr-right{text-align:right}
.hdr-name{color:#fff;font-weight:800;font-size:17px;line-height:1.2}
.hdr-title{color:rgba(255,255,255,.75);font-size:13px;margin-top:2px}
.body{max-width:700px;margin:0 auto;padding:28px 16px}
.card{background:#fff;border-radius:12px;padding:22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sec{font-size:15px;font-weight:800;color:#22367b;margin-bottom:14px}
label{font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px}
input{width:100%;padding:9px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;font-family:'Nunito',sans-serif;outline:none}
.btn{display:inline-block;padding:11px 22px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:'Nunito',sans-serif;background:#22367b;color:#fff;transition:opacity .15s}
.btn:disabled,.btn.off{opacity:.4;cursor:default}
.back{padding:10px 20px;border-radius:8px;border:1px solid #e5e7eb;background:#f9fafb;cursor:pointer;font-weight:700;font-size:14px;font-family:'Nunito',sans-serif;color:#6b7280}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:13px;font-weight:500;cursor:default;border:2px solid transparent;user-select:none}
.cc.av{background:#f0fdf4;color:#166534;cursor:pointer;font-weight:700}.cc.av:hover{background:#dcfce7}
.cc.sl{background:#22367b!important;color:#fff!important;border-color:#22367b!important;font-weight:800}
.cc.td{background:#eff6ff;color:#22367b;border-color:#bfdbfe;font-weight:700}
.cc.em{color:#d1d5db}
.times{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ts{padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;background:#f0f9ff;color:#0369a1;border:2px solid #bae6fd;font-family:'Nunito',sans-serif;user-select:none}
.ts.sl{background:#22367b;color:#fff;border-color:#22367b}
.type-card{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:10px;margin-bottom:8px;border:2px solid #e5e7eb;cursor:pointer;user-select:none;transition:all .15s}
.type-card.sl{border-color:#22367b;background:#eff6ff}
.type-card .tn{font-weight:700;font-size:14px;color:#374151}.type-card.sl .tn{color:#22367b}
.type-card .td2{font-size:13px;color:#6b7280;white-space:nowrap;margin-left:12px}
.info{background:#eff6ff;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#22367b;font-weight:600}
.success{background:#ecfdf5;border:2px solid #6ee7b7;border-radius:12px;padding:32px;text-align:center}
.err{color:#dc2626;font-size:13px;margin-top:10px}
.hd{display:none}
.frow{display:flex;flex-direction:column;gap:12px}
.stepbar{display:flex;gap:6px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
.sn{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav button{padding:5px 10px;border-radius:6px;border:1px solid #e5e7eb;background:#f9fafb;cursor:pointer;font-family:'Nunito',sans-serif}
</style>
</head>
<body>
<div class="hdr">
  <img src="https://i.imgur.com/IVPOWqc.png" alt="ClipEscola" onerror="this.style.display='none'">
  <div class="hdr-right"><div class="hdr-name">Alini Farias</div><div class="hdr-title">Customer Success Manager</div></div>
</div>
<div class="body">
  <div id="s1" class="card">
    <div class="sec">Qual tipo de reunião deseja agendar?</div>
    <div class="type-card" id="tc-mt1" data-id="mt1" data-dur="120" onclick="pickType('mt1',120,'Reunião de Treinamento')"><span class="tn">Reunião de Treinamento</span><span class="td2">(2 horas)</span></div><div class="type-card" id="tc-mt2" data-id="mt2" data-dur="60" onclick="pickType('mt2',60,'Reunião de Alinhamento')"><span class="tn">Reunião de Alinhamento</span><span class="td2">(1 hora)</span></div>
    <button class="btn off" id="btn1" onclick="if(!this.classList.contains('off'))goStep(2)" style="margin-top:8px">Próximo →</button>
  </div>
  <div id="s2" class="card hd">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div class="sec" style="margin:0">Escolha a data e horário</div>
      <div class="cal-nav">
        <button onclick="prevM()">‹</button>
        <span id="cal-lbl" style="font-size:13px;font-weight:700;min-width:110px;text-align:center"></span>
        <button onclick="nextM()">›</button>
      </div>
    </div>
    <div id="cal"></div>
    <div id="tw" class="hd" style="margin-top:16px">
      <div id="tl" style="font-size:13px;font-weight:700;color:#6b7280;margin-bottom:8px"></div>
      <div id="times" class="times"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="back" onclick="goStep(1)">← Voltar</button>
      <button class="btn off" id="btn2" onclick="if(!this.classList.contains('off'))goStep(3)">Próximo →</button>
    </div>
  </div>
  <div id="s3" class="card hd">
    <div class="sec">Preencha seus dados</div>
    <div class="info" id="ibar"></div>
    <div class="frow">
      <div><label>Nome da Escola *</label><input id="fi-school" placeholder="Ex: Colégio São Paulo"></div>
      <div><label>Nome do Responsável *</label><input id="fi-contact" placeholder="Ex: João Silva"></div>
      <div><label>E-mail *</label><input id="fi-email" type="email" placeholder="joao@escola.com.br"></div>
      <div><label>Telefone/WhatsApp *</label><input id="fi-phone" placeholder="(11) 99999-0000"></div>
      <div><label>Outros participantes (opcional)</label><input id="fi-guests" placeholder="e-mails separados por vírgula"></div>
    </div>
    <div id="ferr" class="err hd"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="back" onclick="goStep(2)">← Voltar</button>
      <button class="btn" id="btn3" onclick="confirmar()">✓ Confirmar agendamento</button>
    </div>
  </div>
  <div id="succ" class="success hd">
    <div style="font-size:44px;margin-bottom:10px">✅</div>
    <div style="font-size:18px;font-weight:800;color:#057a55;margin-bottom:6px">Reunião agendada com sucesso!</div>
    <div id="sd" style="color:#6b7280;font-size:14px"></div>
    <p style="margin-top:6px;color:#6b7280;font-size:13px">Você receberá um convite no e-mail em breve.</p>
    <button class="btn" style="margin-top:16px" onclick="location.reload()">Novo agendamento</button>
  </div>
</div>
<script>
var SBT={"mt1":[{"day":1,"time":"09:30"},{"day":1,"time":"14:30"},{"day":2,"time":"09:00"},{"day":2,"time":"14:30"},{"day":3,"time":"09:30"},{"day":3,"time":"14:30"},{"day":4,"time":"09:00"},{"day":4,"time":"14:30"},{"day":5,"time":"09:30"},{"day":5,"time":"14:00"}],"mt2":[{"day":1,"time":"09:30"},{"day":1,"time":"14:30"},{"day":2,"time":"09:00"},{"day":2,"time":"14:30"},{"day":3,"time":"09:30"},{"day":3,"time":"14:30"},{"day":4,"time":"09:00"},{"day":4,"time":"14:30"},{"day":5,"time":"09:30"},{"day":5,"time":"14:00"}]};
var WV="https://n8n.clipescola.com.br/webhook/verificar-csm",WA="https://n8n.clipescola.com.br/webhook/agendar-csm";
var CSM_NAME="Alini Farias",CSM_EMAIL="alini.clipescola@gmail.com",CSM_ICS="https://calendar.google.com/calendar/ical/alini.clipescola%40gmail.com/private-45146bbd5a547df23dfcf600d0d55e95/basic.ics",SHEET="1rwNkmBUlOjfUHbIbHpyHiLfou8tYyJfQbZtz0dwjgwA";
var cy=new Date().getFullYear(),cm=new Date().getMonth();
var selDate="",selTime="",typeId="",typeName="",typeDur=0;
var MONTHS=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var DS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
var DL=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
function fD(m){var h=Math.floor(m/60),r=m%60;return r?h+"h"+r+"min":h+" hora"+(h>1?"s":"")}
function aM(t,m){var p=t.split(":"),v=+p[0]*60+ +p[1]+m;return ("0"+Math.floor(v/60)).slice(-2)+":"+("0"+(v%60)).slice(-2)}
function pickType(id,dur,name){
  document.querySelectorAll(".type-card").forEach(function(e){e.classList.remove("sl")});
  var el=document.getElementById("tc-"+id);if(el)el.classList.add("sl");
  typeId=id;typeDur=dur;typeName=name;
  var b=document.getElementById("btn1");b.classList.remove("off");
}
function goStep(n){
  ["s1","s2","s3","succ"].forEach(function(s){document.getElementById(s).classList.add("hd")});
  document.getElementById("s"+n).classList.remove("hd");
  if(n===2)renderCal();
  if(n===3){
    var dt=new Date(selDate+"T12:00:00");
    document.getElementById("ibar").textContent="📅 "+DL[dt.getDay()]+", "+dt.getDate()+" de "+MONTHS[dt.getMonth()]+" de "+dt.getFullYear()+" às "+selTime+" · "+typeName+" · "+fD(typeDur)+" · com Alini Farias";
  }
}
function renderCal(){
  document.getElementById("cal-lbl").textContent=MONTHS[cm].charAt(0).toUpperCase()+MONTHS[cm].slice(1)+" "+cy;
  var slots=SBT[typeId]||[];
  var wds=[...new Set(slots.map(function(s){return s.day}))];
  var today=new Date();today.setHours(0,0,0,0);
  var first=new Date(cy,cm,1).getDay(),days=new Date(cy,cm+1,0).getDate();
  var h="<div class='cal'>";
  DS.forEach(function(d){h+="<div style='text-align:center;font-size:11px;font-weight:700;color:#6b7280;padding:4px 0'>"+d+"</div>"});
  for(var i=0;i<first;i++)h+="<div></div>";
  for(var d=1;d<=days;d++){
    var dt=new Date(cy,cm,d);
    var iso=cy+"-"+("0"+(cm+1)).slice(-2)+"-"+("0"+d).slice(-2);
    var isT=dt.getTime()===today.getTime();
    var av=wds.indexOf(dt.getDay())>=0&&dt>=today;
    var cls="cc"+(iso===selDate?" sl":isT?" td":av?" av":" em");
    var oc=av?"onclick="pickDate('"+iso+"',"+dt.getDay()+")"":"";
    h+="<div class='"+cls+"' "+oc+">"+d+"</div>";
  }
  h+="</div>";
  document.getElementById("cal").innerHTML=h;
  document.getElementById("tw").classList.add("hd");
}
function pickDate(iso,dow){
  selDate=iso;selTime="";
  var b2=document.getElementById("btn2");b2.classList.add("off");
  renderCal();
  var tw=document.getElementById("tw");tw.classList.remove("hd");
  var dt=new Date(iso+"T12:00:00");
  document.getElementById("tl").textContent="⏳ Verificando disponibilidade...";
  document.getElementById("times").innerHTML="";
  var daySlots=(SBT[typeId]||[]).filter(function(s){return s.day===dow});
  fetch(WV,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({csmEmail:CSM_EMAIL,icsUrl:CSM_ICS,date:iso,duration:typeDur,slots:daySlots})})
  .then(function(r){return r.json()})
  .then(function(data){
    var free=(data.slots||[]).map(function(s){return s.time});
    renderTimes(free,dt);
  }).catch(function(){
    renderTimes(daySlots.map(function(s){return s.time}),dt);
  });
}
function renderTimes(free,dt){
  document.getElementById("tl").textContent="Horários — "+DL[dt.getDay()]+", "+dt.getDate()+" de "+MONTHS[dt.getMonth()];
  if(free.length===0){document.getElementById("times").innerHTML="<span style='color:#dc2626;font-size:13px'>Nenhum horário disponível. Escolha outra data.</span>";return;}
  var h="";
  free.forEach(function(t){var e=aM(t,typeDur);h+="<div class='ts' onclick="pickTime('"+t+"',this)">"+t+" <span style='font-size:11px;opacity:.7'>até "+e+"</span></div>";});
  document.getElementById("times").innerHTML=h;
}
function pickTime(t,el){selTime=t;document.querySelectorAll(".ts").forEach(function(e){e.classList.remove("sl")});el.classList.add("sl");document.getElementById("btn2").classList.remove("off");}
function prevM(){cm--;if(cm<0){cm=11;cy--;}renderCal();}
function nextM(){cm++;if(cm>11){cm=0;cy++;}renderCal();}
function confirmar(){
  var s=document.getElementById("fi-school").value.trim(),c=document.getElementById("fi-contact").value.trim(),e=document.getElementById("fi-email").value.trim(),p=document.getElementById("fi-phone").value.trim(),g=document.getElementById("fi-guests").value.trim();
  var er=document.getElementById("ferr");
  if(!s||!c||!e||!p){er.textContent="Preencha todos os campos obrigatórios.";er.classList.remove("hd");return;}
  er.classList.add("hd");
  var btn=document.getElementById("btn3");btn.disabled=true;btn.textContent="Aguarde...";
  fetch(WA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({csm:CSM_NAME,csmEmail:CSM_EMAIL,icsUrl:CSM_ICS,sheetId:SHEET,date:selDate,time:selTime,endTime:aM(selTime,typeDur),meetingType:typeName,duration:typeDur,school:s,contact:c,email:e,phone:p,guests:g})})
  .then(function(){
    ["s1","s2","s3"].forEach(function(x){document.getElementById(x).classList.add("hd")});
    document.getElementById("succ").classList.remove("hd");
    var dt=new Date(selDate+"T12:00:00");
    document.getElementById("sd").innerHTML="<strong>"+typeName+"</strong> com <strong>"+CSM_NAME+"</strong><br>📅 "+dt.getDate()+" de "+MONTHS[dt.getMonth()]+" de "+cy+" às "+selTime+" · ⏱ "+fD(typeDur);
  }).catch(function(){er.textContent="Erro ao enviar. Tente novamente.";er.classList.remove("hd");btn.disabled=false;btn.textContent="✓ Confirmar agendamento";});
}
</script>
</body>
</html>
